<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aceite da parceria | Clubbar</title>
    <link rel="icon" type="image/png" href="assets/images/coruja.png" />
    <style>
      :root {
        --gold: #f5c542;
        --blue: #1976d2;
        --green: #278b45;
        --red: #d93232;
        --line: #d9dde2;
        --muted: #666;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        color: #202124;
        background: #f4f5f7;
        font-family: Arial, Helvetica, sans-serif;
      }
      button, input { font: inherit; }
      button { cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: .55; }
      .hidden { display: none !important; }

      .topbar {
        height: 74px;
        padding: 8px max(18px, 6vw);
        display: grid;
        grid-template-columns: 40px minmax(0, 1fr) 40px;
        align-items: center;
        background: #000;
      }
      .topbar img {
        width: auto;
        height: 58px;
        max-width: 68vw;
        object-fit: contain;
        justify-self: center;
        transform: scale(1.25);
      }
      .back {
        color: #fff;
        text-decoration: none;
        font-size: 24px;
        font-weight: 900;
      }

      main {
        width: min(920px, calc(100% - 28px));
        margin: 0 auto;
        padding: 28px 0 50px;
      }
      .lead-name {
        margin: 0;
        color: var(--blue);
        font-size: clamp(25px, 5vw, 34px);
      }
      .subtitle {
        margin: 7px 0 8px;
        color: #333;
        font-size: 17px;
      }
      .establishment-name {
        margin: 0 0 22px;
        color: var(--blue);
        font-size: 20px;
        font-weight: 900;
      }
      .card {
        padding: clamp(18px, 4vw, 28px);
        border: 1px solid var(--line);
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 8px 24px rgba(0,0,0,.08);
      }
      .contract-title {
        margin: 0 0 16px;
        color: #1f1f1f;
        font-size: 20px;
      }
      .contract-text {
        max-height: 440px;
        overflow: auto;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #f8f9fa;
        white-space: pre-wrap;
        line-height: 1.55;
      }
      .tools { margin: 14px 0; }
      .check-row {
        margin-top: 18px;
        padding: 14px;
        display: flex;
        align-items: center;
        gap: 11px;
        border: 1px solid #abdaba;
        border-radius: 13px;
        background: #effaf3;
        font-weight: 800;
      }
      .check-row input { width: 21px; height: 21px; accent-color: var(--green); }
      .decision-copy { margin: 20px 0; color: var(--muted); line-height: 1.55; }
      .button {
        width: 100%;
        min-height: 50px;
        padding: 12px 16px;
        border: 0;
        border-radius: 13px;
        color: #000;
        background: var(--gold);
        font-weight: 900;
      }
      .button.secondary { border: 1px solid #444; background: #fff; }
      .button.green { color: #fff; background: var(--green); }
      .payment {
        margin-top: 18px;
        padding: 17px;
        border: 1px solid #bbd9f5;
        border-radius: 15px;
        background: #f1f8ff;
      }
      .payment p { margin: 7px 0 14px; color: var(--muted); line-height: 1.45; }
      .payment-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .accepted {
        margin-top: 18px;
        padding: 14px;
        border-radius: 13px;
        color: #17662e;
        background: #e9f7ed;
        font-weight: 900;
      }
      .state { padding: 60px 20px; text-align: center; }
      .toast {
        position: fixed;
        right: 18px;
        bottom: 18px;
        max-width: min(430px, calc(100% - 36px));
        padding: 14px 18px;
        border-radius: 12px;
        color: #fff;
        background: #198754;
        box-shadow: 0 8px 28px rgba(0,0,0,.25);
        font-weight: 800;
      }
      .toast.error { background: var(--red); }
      @media (max-width: 560px) {
        main { padding-top: 20px; }
        .payment-actions { grid-template-columns: 1fr; }
        .contract-text { max-height: 390px; padding: 13px; font-size: 14px; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="back" id="voltar" href="portal-lead.html" aria-label="Voltar">←</a>
      <img src="assets/images/logo.png" alt="Clubbar Lead" />
      <span></span>
    </header>

    <div class="state" id="carregando">Carregando contrato...</div>
    <div class="state hidden" id="erro"></div>

    <main class="hidden" id="conteudo">
      <h1 class="lead-name" id="nomeLead"></h1>
      <p class="subtitle">Leia atentamente o seu contrato</p>
      <p class="establishment-name" id="nomeEstabelecimento"></p>

      <section class="card">
        <h2 class="contract-title" id="tituloContrato"></h2>
        <div class="contract-text" id="textoContrato"></div>

        <div class="tools">
          <button class="button secondary" id="baixarPdf" type="button">
            Baixar ou compartilhar contrato em PDF
          </button>
        </div>

        <label class="check-row" id="areaAceite">
          <input id="aceite" type="checkbox" />
          <span>Li e aceito o contrato</span>
        </label>

        <div class="accepted hidden" id="aceito">✓ Contrato aceito</div>

        <p class="decision-copy">
          Esta decisão será registrada somente para o estabelecimento selecionado.
          Depois de conhecer a proposta e o contrato, confirme o aceite para continuar.
        </p>

        <button class="button" id="confirmarAceite" type="button" disabled>
          Confirme o aceite do contrato para continuar
        </button>

        <div class="payment hidden" id="pagamento"></div>
      </section>
    </main>

    <script src="js/config.js"></script>
    <script>
      const STORAGE_KEY = "clubbar_portal_lead_token";
      const token = localStorage.getItem(STORAGE_KEY);
      const params = new URLSearchParams(window.location.search);
      const estabelecimentoId = Number(params.get("leadestabelecimento_id"));
      let contratoAtual = null;

      const el = {
        carregando: document.getElementById("carregando"),
        erro: document.getElementById("erro"),
        conteudo: document.getElementById("conteudo"),
        nomeLead: document.getElementById("nomeLead"),
        nomeEstabelecimento: document.getElementById("nomeEstabelecimento"),
        tituloContrato: document.getElementById("tituloContrato"),
        textoContrato: document.getElementById("textoContrato"),
        baixarPdf: document.getElementById("baixarPdf"),
        areaAceite: document.getElementById("areaAceite"),
        aceite: document.getElementById("aceite"),
        aceito: document.getElementById("aceito"),
        confirmarAceite: document.getElementById("confirmarAceite"),
        pagamento: document.getElementById("pagamento"),
        voltar: document.getElementById("voltar"),
      };

      el.voltar.href = `portal-lead.html?leadestabelecimento_id=${estabelecimentoId}`;

      function toast(mensagem, erro = false) {
        document.querySelectorAll(".toast").forEach((item) => item.remove());
        const item = document.createElement("div");
        item.className = `toast${erro ? " error" : ""}`;
        item.textContent = mensagem;
        document.body.append(item);
        setTimeout(() => item.remove(), 6500);
      }

      async function api(caminho, opcoes = {}) {
        const headers = new Headers(opcoes.headers || {});
        headers.set("Authorization", `Bearer ${token}`);
        if (opcoes.body) headers.set("Content-Type", "application/json");
        const resposta = await fetch(`${CLUBBAR_CONFIG.API_BASE_URL}${caminho}`, { ...opcoes, headers });
        const texto = await resposta.text();
        let dados = {};
        if (texto) {
          try { dados = JSON.parse(texto); } catch { dados = { detail: texto }; }
        }
        if (!resposta.ok) {
          const detalhe = dados.detail;
          let mensagem = "Não foi possível concluir a operação.";
          if (typeof detalhe === "string") {
            mensagem = detalhe;
          } else if (Array.isArray(detalhe)) {
            mensagem = detalhe
              .map((item) => item.description || item.msg || JSON.stringify(item))
              .join(" ");
          } else if (detalhe && typeof detalhe === "object") {
            const erros = Array.isArray(detalhe.errors) ? detalhe.errors : [];
            mensagem = erros.length
              ? erros
                  .map((item) => item.description || item.msg || JSON.stringify(item))
                  .join(" ")
              : detalhe.description || detalhe.message || JSON.stringify(detalhe);
          }
          throw new Error(mensagem);
        }
        return dados;
      }

      function nomeStatus(status) {
        return { ENVIADO: "Enviado", ACEITO: "Aceito" }[status] || status;
      }

      function moeda(valor) {
        return Number(valor || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
      }

      function renderizarConclusao() {
        el.pagamento.replaceChildren();
        el.pagamento.classList.remove("hidden");
        const titulo = document.createElement("strong");
        titulo.textContent = "Contrato aceito";
        const descricao = document.createElement("p");
        descricao.textContent =
          "Conclua a parceria para que a equipe Clubbar possa converter o cadastro e iniciar a implantação.";
        el.pagamento.append(titulo, descricao);
        const concluir = document.createElement("button");
        concluir.className = "button green";
        concluir.textContent = "Concluir parceria";
        concluir.addEventListener("click", concluirParceria);
        el.pagamento.append(concluir);
      }

      function renderizar(resumo) {
        const estabelecimento = (resumo.estabelecimentos || []).find(
          (item) => item.leadestabelecimento_id === estabelecimentoId,
        );
        contratoAtual = estabelecimento?.contratos?.[0];
        if (!estabelecimento || !contratoAtual?.conteudocontrato) {
          throw new Error("O contrato ainda não foi disponibilizado para este estabelecimento.");
        }
        el.nomeLead.textContent = resumo.nmresponsavel || "Lead";
        el.nomeEstabelecimento.textContent = estabelecimento.nmestabelecimento || "Estabelecimento";
        el.tituloContrato.textContent = `Contrato ${contratoAtual.versao}`;
        el.textoContrato.textContent = contratoAtual.conteudocontrato;
        const foiAceito = contratoAtual.status === "ACEITO";
        el.areaAceite.classList.toggle("hidden", foiAceito);
        el.aceito.classList.toggle("hidden", !foiAceito);
        el.confirmarAceite.classList.toggle("hidden", foiAceito);
        el.confirmarAceite.disabled = foiAceito || !el.aceite.checked;
        el.pagamento.classList.toggle("hidden", !foiAceito);
        if (foiAceito) renderizarConclusao();
        el.carregando.classList.add("hidden");
        el.erro.classList.add("hidden");
        el.conteudo.classList.remove("hidden");
      }

      async function carregar() {
        if (!token || !estabelecimentoId) {
          window.location.href = "portal-lead.html";
          return;
        }
        try {
          const resumo = await api(`/portal-parceiro/resumo?leadestabelecimento_id=${estabelecimentoId}`);
          renderizar(resumo);
        } catch (erro) {
          el.carregando.classList.add("hidden");
          el.erro.textContent = erro.message;
          el.erro.classList.remove("hidden");
        }
      }

      async function aceitarContrato() {
        el.confirmarAceite.disabled = true;
        try {
          await api(`/portal-parceiro/contratos/${contratoAtual.leadestabelecimentocontrato_id}/aceitar`, { method: "PATCH" });
          toast("Contrato aceito com sucesso.");
          await carregar();
        } catch (erro) {
          toast(erro.message, true);
          el.confirmarAceite.disabled = false;
        }
      }

      async function concluirParceria() {
        try {
          await api("/portal-parceiro/status", {
            method: "PATCH",
            body: JSON.stringify({ leadestabelecimento_id: estabelecimentoId, status: "ACEITOU_PARCERIA" }),
          });
          toast("Parceria aceita com sucesso.");
          setTimeout(() => { window.location.href = el.voltar.href; }, 900);
        } catch (erro) { toast(erro.message, true); }
      }

      async function baixarPdf() {
        try {
          const resposta = await fetch(
            `${CLUBBAR_CONFIG.API_BASE_URL}/portal-parceiro/contratos/${contratoAtual.leadestabelecimentocontrato_id}/pdf`,
            { headers: { Authorization: `Bearer ${token}` } },
          );
          if (!resposta.ok) throw new Error("Não foi possível gerar o PDF do contrato.");
          const blob = await resposta.blob();
          const arquivo = new File([blob], `contrato-clubbar-${contratoAtual.leadestabelecimentocontrato_id}.pdf`, { type: "application/pdf" });
          if (navigator.canShare?.({ files: [arquivo] })) {
            await navigator.share({ title: "Contrato de parceria Clubbar", files: [arquivo] });
            return;
          }
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = arquivo.name;
          link.click();
          setTimeout(() => URL.revokeObjectURL(url), 2000);
        } catch (erro) { toast(erro.message, true); }
      }

      el.aceite.addEventListener("change", () => {
        el.confirmarAceite.disabled = !el.aceite.checked;
      });
      el.confirmarAceite.addEventListener("click", aceitarContrato);
      el.baixarPdf.addEventListener("click", baixarPdf);
      carregar();
    </script>
  </body>
</html>
