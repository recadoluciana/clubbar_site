<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Novo estabelecimento | Clubbar</title>
  <link rel="icon" type="image/png" href="assets/images/coruja.png">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#202124;font-family:Arial,Helvetica,sans-serif}.topbar{height:76px;padding:7px 18px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;background:#050505;color:#fff}.brand{display:flex;align-items:center;justify-content:center;gap:6px}.brand img{height:49px;object-fit:contain}.brand .owl{width:42px;height:42px}.icon{width:42px;height:42px;border:0;background:transparent;color:#fff;font-size:25px;cursor:pointer}.head{padding:18px 20px;background:linear-gradient(105deg,#ffd54f,#fff4cc,#f5f6f8);border-radius:0 0 22px 22px;box-shadow:0 3px 9px #0002}.head h1{margin:0;color:#1683ff;font-size:clamp(22px,4vw,30px)}.head p{margin:5px 0 0;color:#5f6368;font-size:14px}main{width:min(680px,100%);margin:auto;padding:20px 16px 36px}.card{padding:20px 16px;border:1px solid #dedede;border-radius:18px;background:#fff;box-shadow:0 2px 9px #0002}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:14px}.field.full{grid-column:1/-1}label{display:block;margin:0 0 6px;font-weight:700;font-size:14px}label span{color:#d33}input,select{width:100%;min-height:46px;padding:11px;border:1px solid #bbb;border-radius:10px;background:#fff;font-size:15px}fieldset{margin:4px 0 16px;padding:12px;border:1px solid #ddd;border-radius:12px}legend{padding:0 5px;font-weight:700;font-size:14px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.choices label{margin:0}.choices input{position:absolute;opacity:0}.choices span{display:flex;min-height:48px;align-items:center;justify-content:center;padding:8px;text-align:center;border:1px solid #aaa;border-radius:10px;font-size:12px}.choices input:checked+span{border-color:#1683ff;background:#eef5ff;color:#116cc5;font-weight:700}.actions{display:flex;gap:10px}.btn{flex:1;min-height:50px;border:0;border-radius:12px;background:#ffc83d;color:#111;font-weight:800;font-size:15px;cursor:pointer}.btn:disabled{opacity:.65;cursor:wait}.back{background:#eee}.toast{position:fixed;left:50%;top:18px;z-index:5;transform:translateX(-50%);width:min(470px,calc(100% - 24px));padding:14px 16px;border-radius:12px;background:#1683ff;color:#fff;box-shadow:0 7px 25px #0003;font-weight:700}.toast.error{background:#c62828}@media(max-width:600px){.topbar{height:60px}.topbar img{height:41px}.brand .owl{width:36px;height:36px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.choices{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="topbar"><button class="icon" id="voltar" type="button" aria-label="Voltar">←</button><span class="brand"><img class="owl" src="assets/images/coruja.png" alt=""><img src="assets/images/logo.png" alt="Clubbar"></span><span></span></header>
  <section class="head"><h1>Novo estabelecimento</h1><p>Cadastre outra unidade para negociar separadamente.</p></section>
  <main><form class="card" id="form">
    <div class="field"><label for="nome">Nome <span>*</span></label><input id="nome" required placeholder="Ex.: Adega Bar"></div>
    <div class="field"><label for="tipo">Tipo <span>*</span></label><select id="tipo" required><option value="">Selecione</option><option value="BAR">Bar</option><option value="CASA_NOTURNA">Casa noturna</option><option value="PRODUTOR_EVENTOS">Produtor de eventos</option><option value="CASA_EVENTOS">Casa de eventos</option></select></div>
    <div class="field full"><label for="documento">CPF ou CNPJ <span>*</span></label><input id="documento" required inputmode="numeric" placeholder="Informe o CPF ou CNPJ"></div>
    <fieldset class="field full"><legend>O que deseja vender? <span>*</span></legend><div class="choices"><label><input type="radio" name="venda" value="PRODUTOS"><span>Somente produtos</span></label><label><input type="radio" name="venda" value="INGRESSOS"><span>Somente ingressos</span></label><label><input type="radio" name="venda" value="AMBOS"><span>Produtos e ingressos</span></label></div></fieldset>
    <div class="grid"><div class="field"><label for="estado">Estado <span>*</span></label><select id="estado" required><option value="">Selecione o estado</option></select></div><div class="field"><label for="cidade">Cidade <span>*</span></label><select id="cidade" required disabled><option value="">Selecione primeiro o estado</option></select></div></div>
    <div class="field"><label for="cep">CEP</label><input id="cep" inputmode="numeric" maxlength="9" placeholder="00000-000"></div>
    <div class="grid"><div class="field"><label for="endereco">Endereço</label><input id="endereco"></div><div class="field"><label for="numero">Número</label><input id="numero"></div><div class="field"><label for="bairro">Bairro</label><input id="bairro"></div><div class="field"><label for="complemento">Complemento</label><input id="complemento"></div></div>
    <div class="actions"><button class="btn back" id="voltarRodape" type="button">Voltar</button><button class="btn" id="enviar" type="submit">Cadastrar estabelecimento</button></div>
  </form></main>
  <script src="js/config.js"></script><script src="js/session.js"></script>
  <script>
    const token=sessionStorage.getItem('clubbar_portal_lead_token');const api=CLUBBAR_CONFIG.API_BASE_URL;const $=id=>document.getElementById(id);const el={nome:$('nome'),tipo:$('tipo'),documento:$('documento'),estado:$('estado'),cidade:$('cidade'),cep:$('cep'),endereco:$('endereco'),numero:$('numero'),bairro:$('bairro'),complemento:$('complemento'),form:$('form'),enviar:$('enviar')};
    function toast(msg,error=false){document.querySelectorAll('.toast').forEach(x=>x.remove());const x=document.createElement('div');x.className='toast'+(error?' error':'');x.textContent=msg;document.body.append(x);setTimeout(()=>x.remove(),7000)}
    function nums(v){return String(v||'').replace(/\D/g,'')}
    function documentoValido(v){const n=nums(v);if(/^(\d)\1+$/.test(n))return false;if(n.length===11){let s=0;for(let i=0;i<9;i++)s+=+n[i]*(10-i);let d=s*10%11;if(d===10)d=0;if(d!==+n[9])return false;s=0;for(let i=0;i<10;i++)s+=+n[i]*(11-i);d=s*10%11;if(d===10)d=0;return d===+n[10]}if(n.length===14){let s=0,p=5;for(let i=0;i<12;i++){s+=+n[i]*p;p=p===2?9:p-1}let d=s%11<2?0:11-s%11;if(d!==+n[12])return false;s=0;p=6;for(let i=0;i<13;i++){s+=+n[i]*p;p=p===2?9:p-1}d=s%11<2?0:11-s%11;return d===+n[13]}return false}
    async function carregarEstados(){const r=await fetch(api+'/localidades/estados');const d=await r.json();if(!r.ok)throw Error('Não foi possível carregar os estados.');el.estado.innerHTML='<option value="">Selecione o estado</option>';d.forEach(x=>{const o=document.createElement('option');o.value=x.estado_id;o.textContent=x.sgestado+' - '+x.nmestado;el.estado.append(o)})}
    async function carregarCidades(id){el.cidade.disabled=true;el.cidade.innerHTML='<option value="">Carregando...</option>';if(!id)return;const r=await fetch(api+'/localidades/estados/'+id+'/cidades');const d=await r.json();if(!r.ok)throw Error('Não foi possível carregar as cidades.');el.cidade.innerHTML='<option value="">Selecione a cidade</option>';d.forEach(x=>{const o=document.createElement('option');o.value=x.cidade_id;o.textContent=x.nmcidade;el.cidade.append(o)});el.cidade.disabled=false}
    let cepTimer;async function buscarCep(){clearTimeout(cepTimer);const c=nums(el.cep.value);if(c.length!==8)return;cepTimer=setTimeout(async()=>{try{const r=await fetch('https://viacep.com.br/ws/'+c+'/json/');const d=await r.json();if(!r.ok||d.erro)throw Error('CEP não encontrado.');el.endereco.value=d.logradouro||'';el.bairro.value=d.bairro||'';el.complemento.value=d.complemento||'';const op=[...el.estado.options].find(x=>x.textContent.startsWith((d.uf||'').toUpperCase()+' -'));if(op){el.estado.value=op.value;await carregarCidades(op.value);const ci=[...el.cidade.options].find(x=>x.textContent.toLowerCase()===String(d.localidade||'').toLowerCase());if(ci)el.cidade.value=ci.value}}catch(e){toast(e.message,true)}},300)}
    async function cadastrar(e){e.preventDefault();const venda=document.querySelector('input[name="venda"]:checked')?.value;if(!el.nome.value.trim())return toast('Informe o nome do estabelecimento.',true);if(!el.tipo.value)return toast('Selecione o tipo do estabelecimento.',true);if(!documentoValido(el.documento.value))return toast('Informe um CPF ou CNPJ válido.',true);if(!venda)return toast('Selecione o que deseja vender.',true);if(!el.estado.value||!el.cidade.value)return toast('Selecione estado e cidade.',true);el.enviar.disabled=true;el.enviar.textContent='Cadastrando...';try{const r=await fetch(api+'/portal-parceiro/estabelecimentos',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({nmestabelecimento:el.nome.value.trim(),tipo:el.tipo.value,tipovenda:venda,cpfcnpj:nums(el.documento.value),cep:nums(el.cep.value)||null,endereco:el.endereco.value.trim()||null,numero:el.numero.value.trim()||null,bairro:el.bairro.value.trim()||null,complemento:el.complemento.value.trim()||null,cidade_id:Number(el.cidade.value),estado_id:Number(el.estado.value)})});const d=await r.json();if(!r.ok)throw Error(d.detail||'Não foi possível cadastrar o estabelecimento.');toast('Estabelecimento cadastrado com sucesso.');setTimeout(()=>location.href='portal-lead-estabelecimentos.html',900)}catch(err){toast(err.message,true);el.enviar.disabled=false;el.enviar.textContent='Cadastrar estabelecimento'}}
    $('voltar').onclick=$('voltarRodape').onclick=()=>location.href='portal-lead-estabelecimentos.html';el.estado.onchange=()=>carregarCidades(el.estado.value).catch(e=>toast(e.message,true));el.cep.oninput=buscarCep;el.form.onsubmit=cadastrar;if(!token)location.replace('portal-lead.html');else carregarEstados().catch(e=>toast(e.message,true));
  </script>
</body>
</html>
