<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Documentos contratuais | Clubbar</title><link rel="icon" type="image/png" href="assets/images/coruja.png">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#202124;font-family:Arial,Helvetica,sans-serif}.topbar{height:74px;padding:8px 18px;display:grid;grid-template-columns:42px 1fr 42px;align-items:center;background:#050505}.brand{display:flex;align-items:center;justify-content:center;gap:6px}.brand img{object-fit:contain}.brand .owl{width:46px;height:46px}.brand .logo{height:43px}.back{color:#fff;text-decoration:none;font-size:25px;font-weight:900}main{width:min(920px,calc(100% - 28px));margin:auto;padding:28px 0 48px}.lead{margin:0;color:#1976d2;font-size:clamp(25px,5vw,34px)}.estab{margin:7px 0 5px;color:#1976d2;font-size:21px;font-weight:800}.intro{margin:0 0 20px;color:#60646c;line-height:1.45}.document{margin-bottom:14px;border:1px solid #d9dde2;border-radius:18px;background:#fff;box-shadow:0 6px 20px #00000010;overflow:hidden}.document-head{display:flex;align-items:flex-start;gap:12px;padding:18px}.document-icon{display:grid;place-items:center;flex:0 0 46px;height:46px;border-radius:50%;background:#e8f5ec;color:#198754;font-size:22px}.document-info{min-width:0;flex:1}.document-title{margin:0;font-size:18px}.document-meta{margin:5px 0 0;color:#646970;font-size:13px}.hash{display:block;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}.badge{padding:6px 10px;border-radius:20px;background:#e8f5ec;color:#176b3b;font-size:11px;font-weight:800}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 18px 18px}.action{padding:11px 8px;border:1px solid #d2d7dc;border-radius:12px;background:#fff;color:#202124;font-weight:700;cursor:pointer}.action.primary{border-color:#ffc107;background:#ffc107}.contract{margin:0 18px 18px;padding:20px;border:1px solid #d9dde2;border-radius:14px;background:#f8f9fa;white-space:pre-wrap;line-height:1.6;font-size:15px}.hidden{display:none!important}.state{text-align:center;padding:60px 20px}.btn{display:block;width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:#ffc107;color:#111;text-align:center;text-decoration:none;font-weight:800;font-size:16px}.toast{position:fixed;right:18px;bottom:18px;max-width:min(420px,calc(100% - 36px));padding:13px 17px;border-radius:12px;background:#202124;color:#fff;box-shadow:0 8px 24px #0004}.toast.error{background:#c62828}@media(max-width:620px){.actions{grid-template-columns:1fr}.document-head{flex-wrap:wrap}.badge{margin-left:58px}.contract{font-size:14px;padding:14px}}
  </style>
</head>
<body>
  <header class="topbar"><a class="back" id="voltar" href="#">←</a><span class="brand"><img class="owl" src="assets/images/coruja.png" alt=""><img class="logo" src="assets/images/logo.png" alt="Clubbar"></span><span></span></header>
  <div class="state" id="estado">Carregando documentos contratuais...</div>
  <main id="conteudo" hidden><h1 class="lead" id="lead"></h1><h2 class="estab" id="estabelecimento"></h2><p class="intro">O contrato original e todas as retificações assinadas permanecem disponíveis para consulta.</p><section id="documentos"></section><a class="btn" id="voltarBtn" href="#">Voltar</a></main>
  <script src="js/config.js"></script><script src="js/session.js"></script>
  <script>
    const token=sessionStorage.getItem('clubbar_portal_lead_token');const id=Number(new URLSearchParams(location.search).get('leadestabelecimento_id'));const api=CLUBBAR_CONFIG.API_BASE_URL;const estado=document.getElementById('estado');const main=document.getElementById('conteudo');const voltar=`portal-lead.html?leadestabelecimento_id=${id}`;document.getElementById('voltar').href=voltar;document.getElementById('voltarBtn').href=voltar;
    function dataHora(valor){if(!valor)return 'Data de assinatura não informada';const data=new Date(valor);if(Number.isNaN(data.getTime()))return 'Data de assinatura não informada';return `Assinado em ${data.toLocaleDateString('pt-BR')} às ${data.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`}
    function nomeDocumento(c){return c.tipoinstrumento==='RETIFICACAO'?`Retificação nº ${c.nrretificacao}`:`Contrato original • versão ${c.versao}`}
    function nomeArquivo(c){return c.tipoinstrumento==='RETIFICACAO'?`retificacao-${c.nrretificacao}-clubbar.pdf`:`contrato-original-clubbar.pdf`}
    function toast(mensagem,erro=false){document.querySelector('.toast')?.remove();const item=document.createElement('div');item.className=`toast${erro?' error':''}`;item.textContent=mensagem;document.body.append(item);setTimeout(()=>item.remove(),4000)}
    async function arquivoPdf(c){const resposta=await fetch(`${api}/portal-parceiro/contratos/${c.leadestabelecimentocontrato_id}/pdf`,{headers:{Authorization:`Bearer ${token}`}});if(!resposta.ok){const dados=await resposta.json().catch(()=>({}));throw Error(dados.detail||'Não foi possível gerar o PDF.')}return new File([await resposta.blob()],nomeArquivo(c),{type:'application/pdf'})}
    async function baixar(c){try{const arquivo=await arquivoPdf(c);const url=URL.createObjectURL(arquivo);const link=document.createElement('a');link.href=url;link.download=arquivo.name;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);toast('PDF gerado com sucesso.')}catch(err){toast(err.message,true)}}
    async function compartilhar(c){try{const arquivo=await arquivoPdf(c);if(navigator.canShare?.({files:[arquivo]})){await navigator.share({title:nomeDocumento(c),text:`Documento contratual do estabelecimento ${document.getElementById('estabelecimento').textContent.replace('Estabelecimento: ','')}.`,files:[arquivo]});return}await baixar(c);toast('O compartilhamento direto não está disponível. O PDF foi baixado.')}catch(err){if(err?.name!=='AbortError')toast(err.message,true)}}
    function card(c){const artigo=document.createElement('article');artigo.className='document';const cabecalho=document.createElement('div');cabecalho.className='document-head';const icone=document.createElement('div');icone.className='document-icon';icone.textContent='✓';const info=document.createElement('div');info.className='document-info';const titulo=document.createElement('h3');titulo.className='document-title';titulo.textContent=nomeDocumento(c);const meta=document.createElement('p');meta.className='document-meta';meta.textContent=dataHora(c.dtaceite);if(c.hashdocumento){const hash=document.createElement('span');hash.className='hash';hash.title=c.hashdocumento;hash.textContent=`Hash: ${c.hashdocumento}`;meta.append(hash)}info.append(titulo,meta);const badge=document.createElement('span');badge.className='badge';badge.textContent='Assinado';cabecalho.append(icone,info,badge);const acoes=document.createElement('div');acoes.className='actions';const visualizar=document.createElement('button');visualizar.className='action';visualizar.textContent='Visualizar';const download=document.createElement('button');download.className='action primary';download.textContent='Baixar PDF';download.addEventListener('click',()=>baixar(c));const share=document.createElement('button');share.className='action';share.textContent='Compartilhar PDF';share.addEventListener('click',()=>compartilhar(c));const texto=document.createElement('div');texto.className='contract hidden';texto.textContent=c.conteudocontrato;visualizar.addEventListener('click',()=>{texto.classList.toggle('hidden');visualizar.textContent=texto.classList.contains('hidden')?'Visualizar':'Ocultar'});acoes.append(visualizar,download,share);artigo.append(cabecalho,acoes,texto);return artigo}
    async function carregar(){if(!token||!id){location.href='portal-lead.html';return}try{const r=await fetch(`${api}/portal-parceiro/resumo?leadestabelecimento_id=${id}`,{headers:{Authorization:`Bearer ${token}`}});const d=await r.json();if(!r.ok)throw Error(d.detail||'Não foi possível carregar os documentos.');const e=(d.estabelecimentos||[]).find(x=>x.leadestabelecimento_id===id);const assinados=(e?.contratos||[]).filter(x=>x.status==='ACEITO'&&x.conteudocontrato).sort((a,b)=>a.leadestabelecimentocontrato_id-b.leadestabelecimentocontrato_id);if(!e||!assinados.length)throw Error('Nenhum documento contratual assinado foi encontrado.');document.getElementById('lead').textContent=d.nmresponsavel;document.getElementById('estabelecimento').textContent=`Estabelecimento: ${e.nmestabelecimento}`;const lista=document.getElementById('documentos');assinados.forEach(c=>lista.append(card(c)));estado.hidden=true;main.hidden=false}catch(err){estado.textContent=err.message||'Não foi possível carregar os documentos.'}}carregar();
  </script>
</body>
</html>
