<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visualizar contrato | Clubbar</title>
    <link rel="icon" type="image/png" href="assets/images/coruja.png" />
    <style>
      :root {
        --blue: #1976d2;
        --line: #d9dde2;
        --red: #d93232;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        color: #202124;
        background: #f4f5f7;
        font-family: Arial, Helvetica, sans-serif;
      }
      button { font: inherit; cursor: pointer; }
      .hidden { display: none !important; }
      .topbar {
        height: 74px;
        padding: 8px max(18px, 6vw);
        display: grid;
        grid-template-columns: 40px minmax(0, 1fr) 40px;
        align-items: center;
        background: #000;
      }
      .topbar img {
        width: auto;
        height: 58px;
        max-width: 68vw;
        object-fit: contain;
        justify-self: center;
        transform: scale(1.25);
      }
      .topbar-brand{display:flex;align-items:center;justify-content:center;gap:6px}.topbar-brand .brand-owl{width:48px;height:48px;transform:none}.topbar-brand .brand-logo{height:43px;transform:none}
      .back {
        color: #fff;
        text-decoration: none;
        font-size: 24px;
        font-weight: 900;
      }
      main {
        width: min(920px, calc(100% - 28px));
        margin: 0 auto;
        padding: 28px 0 50px;
      }
      .lead-name {
        margin: 0;
        color: var(--blue);
        font-size: clamp(25px, 5vw, 34px);
      }
      .subtitle {
        margin: 7px 0 22px;
        color: #444;
        font-size: 17px;
      }
      .card {
        padding: clamp(18px, 4vw, 28px);
        border: 1px solid var(--line);
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 8px 24px rgba(0, 0, 0, .08);
      }
      .contract-title {
        margin: 0 0 16px;
        font-size: 20px;
      }
      .establishment-title { margin: 0 0 16px; color: var(--blue); font-size: 22px; }
      .lead-data { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px 16px; margin-bottom:20px; }
      .lead-data div { padding:10px 12px; border-bottom:1px solid #edf0f2; color:#555; font-size:14px; }
      .lead-data strong { display:block; margin-bottom:3px; color:#202124; font-size:12px; }
      .contract-text {
        max-height: 560px;
        overflow: auto;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #f8f9fa;
        white-space: pre-wrap;
        line-height: 1.55;
      }
      .pdf-button {
        width: 100%;
        min-height: 50px;
        margin-top: 16px;
        padding: 12px 16px;
        border: 1px solid #333;
        border-radius: 13px;
        color: #000;
        background: #fff;
        font-weight: 900;
      }
      .sign-button { border:0; color:#fff; background:#168a4a; }
      .sign-button:hover { background:#116d3b; }
      .signed-status { margin-top:18px; padding:14px; border-radius:12px; color:#176b3b; background:#e8f5ec; font-weight:700; }
      .signed-status a { display:block; margin-top:8px; color:#1468bd; font-weight:800; }
      .state { padding: 60px 20px; text-align: center; }
      .toast {
        position: fixed;
        right: 18px;
        bottom: 18px;
        max-width: min(430px, calc(100% - 36px));
        padding: 14px 18px;
        border-radius: 12px;
        color: #fff;
        background: var(--red);
        box-shadow: 0 8px 28px rgba(0, 0, 0, .25);
        font-weight: 800;
      }
      @media (max-width: 560px) {
        main { padding-top: 20px; }
        .contract-text { max-height: 500px; padding: 13px; font-size: 14px; }
        .lead-data { grid-template-columns:1fr; }
      }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="back" id="voltar" href="portal-lead.html" aria-label="Voltar">←</a>
      <span class="topbar-brand"><img class="brand-owl" src="assets/images/coruja.png" alt="" /><img class="brand-logo" src="assets/images/logo.png" alt="Clubbar Lead" /></span>
      <span></span>
    </header>

    <div class="state" id="carregando">Carregando contrato...</div>
    <div class="state hidden" id="erro"></div>

    <main class="hidden" id="conteudo">
      <h1 class="lead-name" id="nomeLead"></h1>
      <p class="subtitle">Visualizar contrato</p>
      <section class="card">
        <h2 class="establishment-title" id="tituloEstabelecimento"></h2>
        <div class="lead-data" id="dadosEstabelecimento"></div>
        <h2 class="contract-title" id="tituloContrato"></h2>
        <div class="contract-text" id="textoContrato"></div>
        <a id="assinarContrato" class="pdf-button sign-button" style="display:block;text-align:center;text-decoration:none">Visualizar/assinar seu contrato</a>
        <div class="signed-status hidden" id="statusAssinado"></div>
      </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/session.js"></script>
    <script src="js/contact.js"></script>
    <script>
      const STORAGE_KEY = "clubbar_portal_lead_token";
      const token = sessionStorage.getItem(STORAGE_KEY);
      const params = new URLSearchParams(window.location.search);
      const estabelecimentoId = Number(params.get("leadestabelecimento_id"));
      let contratoAtual = null;
      const el = {
        voltar: document.getElementById("voltar"),
        carregando: document.getElementById("carregando"),
        erro: document.getElementById("erro"),
        conteudo: document.getElementById("conteudo"),
        nomeLead: document.getElementById("nomeLead"),
        tituloContrato: document.getElementById("tituloContrato"),
        textoContrato: document.getElementById("textoContrato"),
        tituloEstabelecimento: document.getElementById("tituloEstabelecimento"),
        dadosEstabelecimento: document.getElementById("dadosEstabelecimento"),
        statusAssinado: document.getElementById("statusAssinado"),
      };
      el.voltar.href = `portal-lead.html?leadestabelecimento_id=${estabelecimentoId}`;

      async function api(caminho, options = {}) {
        const resposta = await fetch(`${CLUBBAR_CONFIG.API_BASE_URL}${caminho}`, {
          ...options,
          headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
        });
        const dados = await resposta.json().catch(() => ({}));
        if (!resposta.ok) {
          throw new Error(
            typeof dados.detail === "string"
              ? dados.detail
              : "Não foi possível carregar o contrato.",
          );
        }
        return dados;
      }

      function nomeStatus(status) {
        return { RASCUNHO: "Não assinado", ENVIADO: "Pronto para assinar", ACEITO: "Aceito" }[status] || status;
      }

      function texto(valor) { return String(valor ?? "").trim() || "Não informado"; }
      function tipo(valor) { return { BAR: "Bar", CASA_NOTURNA: "Casa noturna", PRODUTOR_EVENTOS: "Produtor de eventos", CASA_EVENTOS: "Casa de eventos" }[valor] || texto(valor); }
      function venda(valor) { return { PRODUTOS: "Somente produtos", INGRESSOS: "Somente ingressos", AMBOS: "Produtos e ingressos" }[valor] || texto(valor); }
      function dataHora(valor) { if (!valor) return ""; const data = new Date(valor); return Number.isNaN(data.getTime()) ? texto(valor) : new Intl.DateTimeFormat("pt-BR", { dateStyle: "short", timeStyle: "short" }).format(data); }
      function campo(rotulo, valor) { const div = document.createElement("div"); div.innerHTML = `<strong>${rotulo}</strong>${texto(valor)}`; return div; }

      function mostrarErro(mensagem) {
        el.carregando.classList.add("hidden");
        el.conteudo.classList.add("hidden");
        el.erro.textContent = mensagem;
        el.erro.classList.remove("hidden");
      }

      async function carregar() {
        if (!token || !estabelecimentoId) {
          window.location.href = "portal-lead.html";
          return;
        }
        try {
          const resumo = await api(
            `/portal-parceiro/resumo?leadestabelecimento_id=${estabelecimentoId}`,
          );
          const estabelecimento = (resumo.estabelecimentos || []).find(
            (item) => item.leadestabelecimento_id === estabelecimentoId,
          );
          contratoAtual = estabelecimento?.contratos?.[0];
          if (!contratoAtual?.conteudocontrato) {
            throw new Error(
              "O contrato ainda não foi disponibilizado para este estabelecimento.",
            );
          }
          el.nomeLead.textContent = resumo.nmresponsavel || "Lead";
          el.tituloEstabelecimento.textContent = `Estabelecimento: ${texto(estabelecimento.nmestabelecimento)}`;
          el.dadosEstabelecimento.replaceChildren(
            campo("Responsável", estabelecimento.nmresponsavel || resumo.nmresponsavel),
            campo("E-mail", estabelecimento.email_responsavel || estabelecimento.email || resumo.email),
            campo("Telefone", estabelecimento.telefone_responsavel || estabelecimento.telefone || resumo.telefone),
            campo("CPF/CNPJ", estabelecimento.cpfcnpj),
            campo("Tipo", tipo(estabelecimento.tipo)),
            campo("O que deseja vender", venda(estabelecimento.tipovenda)),
            campo("CEP", estabelecimento.cep),
            campo("Endereço", estabelecimento.endereco),
            campo("Número", estabelecimento.numero),
            campo("Bairro", estabelecimento.bairro),
            campo("Complemento", estabelecimento.complemento),
            campo("Cidade", estabelecimento.nmcidade),
            campo("Estado", estabelecimento.sgestado),
          );
          el.tituloContrato.textContent =
            `Contrato ${contratoAtual.versao} - ${nomeStatus(contratoAtual.status)}`;
          el.textoContrato.textContent = contratoAtual.conteudocontrato;
          const assinar = document.getElementById("assinarContrato");
          assinar.href = `aceite-parceria.html?leadestabelecimento_id=${estabelecimentoId}`;
          assinar.classList.toggle("hidden", contratoAtual.status === "ACEITO");
          if (contratoAtual.status === "ACEITO") {
            el.statusAssinado.innerHTML = `Contrato assinado em ${dataHora(contratoAtual.dtaceite)}.<a href="visualizar-contrato.html?leadestabelecimento_id=${estabelecimentoId}">Ver contrato assinado</a>`;
            el.statusAssinado.classList.remove("hidden");
          }
          el.carregando.classList.add("hidden");
          el.erro.classList.add("hidden");
          el.conteudo.classList.remove("hidden");
        } catch (erro) {
          mostrarErro(erro.message);
        }
      }

      carregar();
    </script>
  </body>
</html>
